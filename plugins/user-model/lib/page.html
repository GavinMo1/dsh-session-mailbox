<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>user-model</title>
<style>
  :root {
    --bg: #fbfaf8;
    --panel: #ffffff;
    --ink: #1f1d1a;
    --muted: #7c766c;
    --line: #e5e0d8;
    --accent: #2f6f5e;
    --warn: #a8501f;
    --danger: #a3342c;
    --chip: #f1ece3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --panel: #1d2023;
      --ink: #e8e5df;
      --muted: #9a958c;
      --line: #2c3034;
      --accent: #6fb39c;
      --warn: #d98a54;
      --danger: #d4736b;
      --chip: #24282c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.55 ui-sans-serif, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header .brand { font-weight: 650; letter-spacing: .02em; }
  header .root { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  header .spacer { flex: 1; }
  .counts { display: flex; gap: 10px; color: var(--muted); font-size: 13px; }
  .counts b { color: var(--ink); font-weight: 600; }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 330px;
    min-width: 240px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    background: var(--panel);
    min-height: 0;
  }
  aside .filterbox { padding: 10px; border-bottom: 1px solid var(--line); }
  input[type=text], input[type=search], textarea, select {
    width: 100%;
    background: var(--bg);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 8px;
    font: inherit;
  }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #list { overflow: auto; padding: 6px 0 20px; }
  .group { padding: 10px 12px 4px; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  .item {
    padding: 8px 12px;
    border-left: 3px solid transparent;
    cursor: pointer;
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border-top: 0; border-right: 0; border-bottom: 0;
    font: inherit;
    color: inherit;
  }
  .item:hover { background: var(--chip); }
  .item[aria-selected=true] { border-left-color: var(--accent); background: var(--chip); }
  .item .t { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { display: block; color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.dead .t { text-decoration: line-through; color: var(--muted); }
  .item.dead .m { opacity: .65; }
  section#detail { flex: 1; overflow: auto; padding: 20px 26px 60px; min-width: 0; }
  .empty { color: var(--muted); }
  .meta { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace; margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 12px; }
  label.field { display: block; margin-bottom: 14px; }
  label.field > span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  label.field > span .counter { float: right; }
  label.field > span .counter.over { color: var(--danger); }
  textarea { min-height: 180px; resize: vertical; font-family: ui-monospace, Consolas, monospace; line-height: 1.6; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { background: var(--chip); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 26px 0 8px; letter-spacing: .04em; }
  ul.hist { list-style: none; margin: 0; padding: 0; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
  ul.hist li { padding: 2px 0; }
  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 8px 18px; border-radius: 999px; font-size: 13px;
    opacity: 0; transition: opacity .18s; pointer-events: none; max-width: 80vw;
  }
  #toast.show { opacity: .95; }
  #toast.err { background: var(--danger); color: #fff; }
  .formgrid { display: grid; grid-template-columns: 1fr 140px; gap: 12px; }
</style>
</head>
<body>
<header>
  <span class="brand">user-model</span>
  <span class="root" id="root"></span>
  <span class="spacer"></span>
  <span class="counts" id="counts"></span>
  <button id="btn-new">新建</button>
  <button id="btn-refresh">刷新</button>
</header>
<main>
  <aside>
    <div class="filterbox"><input type="search" id="filter" placeholder="按标题或正文过滤…"></div>
    <div id="list"></div>
  </aside>
  <section id="detail"><p class="empty">左侧选一条，或者点「新建」。</p></section>
</main>
<div id="toast"></div>
<script>
const $ = (sel) => document.querySelector(sel)
const NEW = '__new__'
let state = null
let selected = null
let filter = ''

const today = () => new Date().toLocaleDateString('sv')  // sv → YYYY-MM-DD

async function api(path, body) {
  const init = body === undefined ? {} : {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body),
  }
  let res
  try {
    res = await fetch(path, init)
  } catch (e) {
    return { ok: false, error: '无法连接服务：' + e.message }
  }
  let data
  try {
    data = await res.json()
  } catch {
    return { ok: false, error: '响应不是 JSON（HTTP ' + res.status + '）' }
  }
  return data
}

let toastTimer = null
function toast(message, isError) {
  const el = $('#toast')
  el.textContent = message
  el.className = 'show' + (isError ? ' err' : '')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => { el.className = '' }, isError ? 6000 : 2200)
}

function allEntries() {
  if (state === null) return []
  return state.approved.concat(state.staged, state.retired)
}

function findEntry(id) {
  return allEntries().find((e) => e.id === id) || null
}

function matches(entry) {
  if (filter === '') return true
  const q = filter.toLowerCase()
  return (entry.title + '\n' + entry.body).toLowerCase().includes(q)
}

async function refresh() {
  const next = await api('/api/state')
  if (next.ok !== true) { toast(next.error || '读取失败', true); return }
  state = next
  if (selected !== NEW && selected !== null && findEntry(selected) === null) selected = null
  // Land on something instead of an empty pane: the first thing anyone wants
  // when opening this page is to see what is actually in the library.
  if (selected === null) {
    const first = state.approved[0] || state.staged[0] || null
    if (first !== null) selected = first.id
  }
  render()
}

function render() {
  if (state === null) return
  $('#root').textContent = state.root + (state.library === 'missing' ? '（库不存在）' : '')
  const dirty = state.dirty || 0
  $('#counts').innerHTML = ''
  const addCount = (label, n) => {
    const span = document.createElement('span')
    span.innerHTML = label + ' <b></b>'
    span.querySelector('b').textContent = String(n)
    $('#counts').appendChild(span)
  }
  addCount('已生效', state.approved.length)
  addCount('待批准', state.staged.length)
  addCount('已删除', state.retired.length)
  if (dirty > 0) addCount('未提交', dirty)

  renderList()
  renderDetail()
}

function renderList() {
  const box = $('#list')
  box.innerHTML = ''
  if (state === null) return
  const groups = [
    ['待批准', state.staged, ''],
    ['已生效', state.approved, ''],
    ['已删除', state.retired, 'dead'],
  ]
  let shown = 0
  for (const [label, entries, cls] of groups) {
    const visible = entries.filter(matches)
    if (visible.length === 0) continue
    const head = document.createElement('div')
    head.className = 'group'
    head.textContent = label + ' · ' + visible.length
    box.appendChild(head)
    for (const entry of visible) {
      const item = document.createElement('button')
      item.type = 'button'
      item.className = 'item ' + cls
      item.setAttribute('aria-selected', String(entry.id === selected))
      const t = document.createElement('span')
      t.className = 't'
      t.textContent = entry.title
      const m = document.createElement('span')
      m.className = 'm'
      m.textContent = entry.date + ' · ' + entry.kind + ' · ' + entry.id
      item.append(t, m)
      item.addEventListener('click', () => { selected = entry.id; renderList(); renderDetail() })
      box.appendChild(item)
      shown++
    }
  }
  if (shown === 0) {
    const p = document.createElement('p')
    p.className = 'empty'
    p.style.padding = '14px'
    p.textContent = filter === ''
      ? '库是空的。'
      : '没有匹配「' + filter + '」的条目。'
    box.appendChild(p)
  }
}

function metaRow(entry) {
  const wrap = document.createElement('div')
  wrap.className = 'meta'
  const chip = (text) => {
    const s = document.createElement('span')
    s.className = 'chip'
    s.textContent = text
    return s
  }
  wrap.append(chip(entry.id), chip(entry.date), chip(entry.kind))
  if (entry.approvedBy) wrap.append(chip('批准：' + entry.approvedBy))
  if (entry.approvedOn) wrap.append(chip(entry.approvedOn))
  return wrap
}

function counterFor(input, max) {
  const span = document.createElement('span')
  span.className = 'counter'
  const update = () => {
    const n = Array.from(input.value).length
    span.textContent = n + ' / ' + max
    span.classList.toggle('over', n > max)
  }
  input.addEventListener('input', update)
  setTimeout(update, 0)
  return { span, update }
}

function renderDetail() {
  const pane = $('#detail')
  pane.innerHTML = ''
  if (selected === NEW) return renderNew(pane)
  if (selected === null) {
    const p = document.createElement('p')
    p.className = 'empty'
    p.textContent = '左侧选一条，或者点「新建」。'
    pane.appendChild(p)
    return
  }
  const entry = findEntry(selected)
  if (entry === null) {
    const p = document.createElement('p')
    p.className = 'empty'
    p.textContent = '这条已经不在库里了。'
    pane.appendChild(p)
    return
  }

  const stateLabel = state.staged.includes(entry) ? '待批准'
    : state.retired.includes(entry) ? '已删除' : '已生效'
  pane.appendChild(metaRow(entry))
  const badge = document.createElement('div')
  badge.className = 'meta'
  badge.textContent = '状态：' + stateLabel
  pane.appendChild(badge)

  const editable = stateLabel !== '已删除'

  const titleField = document.createElement('label')
  titleField.className = 'field'
  const titleLabel = document.createElement('span')
  titleLabel.textContent = '标题'
  const titleInput = document.createElement('input')
  titleInput.type = 'text'
  titleInput.value = entry.title
  titleInput.readOnly = !editable
  const titleCount = counterFor(titleInput, 60)
  titleLabel.appendChild(titleCount.span)
  titleField.append(titleLabel, titleInput)
  pane.appendChild(titleField)

  const bodyField = document.createElement('label')
  bodyField.className = 'field'
  const bodyLabel = document.createElement('span')
  bodyLabel.textContent = '正文'
  const bodyInput = document.createElement('textarea')
  bodyInput.value = entry.body
  bodyInput.readOnly = !editable
  const bodyCount = counterFor(bodyInput, 400)
  bodyLabel.appendChild(bodyCount.span)
  bodyField.append(bodyLabel, bodyInput)
  pane.appendChild(bodyField)

  const row = document.createElement('div')
  row.className = 'row'

  if (editable) {
    const save = document.createElement('button')
    save.className = 'primary'
    save.textContent = '保存'
    save.addEventListener('click', async () => {
      save.disabled = true
      const result = await api('/api/edit', { id: entry.id, title: titleInput.value, body: bodyInput.value })
      save.disabled = false
      if (result.ok !== true) return toast(result.error, true)
      toast(result.lines ? result.lines[0] : '已保存')
      await refresh()
    })
    row.appendChild(save)
  }

  if (state.staged.includes(entry)) {
    const approve = document.createElement('button')
    approve.textContent = '批准（让它对 agent 可见）'
    approve.addEventListener('click', async () => {
      approve.disabled = true
      const result = await api('/api/approve', { id: entry.id, approvedBy: 'user, ' + today() })
      approve.disabled = false
      if (result.ok !== true) return toast(result.error, true)
      toast('已批准：' + entry.id)
      await refresh()
    })
    row.appendChild(approve)
  }

  if (state.approved.includes(entry) || state.staged.includes(entry)) {
    const del = document.createElement('button')
    del.className = 'danger'
    del.textContent = '删除'
    del.addEventListener('click', async () => {
      if (!confirm('删除「' + entry.title + '」？\n\n它会被移出 agent 能搜到的范围，文件留在 git 历史里，「已删除」一栏可以恢复。')) return
      del.disabled = true
      const result = await api('/api/retire', { id: entry.id, reason: '' })
      del.disabled = false
      if (result.ok !== true) return toast(result.error, true)
      toast('已删除：' + entry.id)
      await refresh()
    })
    row.appendChild(del)
  }

  if (state.retired.includes(entry)) {
    const back = document.createElement('button')
    back.textContent = '恢复'
    back.addEventListener('click', async () => {
      back.disabled = true
      const result = await api('/api/restore', { id: entry.id })
      back.disabled = false
      if (result.ok !== true) return toast(result.error, true)
      toast('已恢复：' + entry.id)
      await refresh()
    })
    row.appendChild(back)
  }

  pane.appendChild(row)

  const histHead = document.createElement('h3')
  histHead.textContent = '历史'
  pane.appendChild(histHead)
  const hist = document.createElement('ul')
  hist.className = 'hist'
  hist.textContent = '读取中…'
  pane.appendChild(hist)
  api('/api/history?id=' + encodeURIComponent(entry.id)).then((result) => {
    hist.innerHTML = ''
    const lines = result.ok === true ? result.lines : [result.error]
    for (const line of lines) {
      const li = document.createElement('li')
      li.textContent = line
      hist.appendChild(li)
    }
  })

  if (editable) {
    const onKey = (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
        event.preventDefault()
        row.querySelector('button.primary')?.click()
      }
    }
    titleInput.addEventListener('keydown', onKey)
    bodyInput.addEventListener('keydown', onKey)
  }
}

function renderNew(pane) {
  const note = document.createElement('p')
  note.className = 'meta'
  note.textContent = '新建的条目先落在待批准区——它不会立刻被 agent 搜到，批准之后才算数。'
  pane.appendChild(note)

  const grid = document.createElement('div')
  grid.className = 'formgrid'

  const slugField = document.createElement('label')
  slugField.className = 'field'
  const slugLabel = document.createElement('span')
  slugLabel.textContent = 'slug（a-z、数字、连字符，唯一）'
  const slugInput = document.createElement('input')
  slugInput.type = 'text'
  slugInput.placeholder = 'commit-lang'
  slugField.append(slugLabel, slugInput)

  const kindField = document.createElement('label')
  kindField.className = 'field'
  const kindLabel = document.createElement('span')
  kindLabel.textContent = 'kind'
  const kindSelect = document.createElement('select')
  for (const [value, text] of [['fact', 'fact（稳定的偏好 / 事实）'], ['decision', 'decision（决定）']]) {
    const option = document.createElement('option')
    option.value = value
    option.textContent = text
    kindSelect.appendChild(option)
  }
  kindField.append(kindLabel, kindSelect)

  grid.append(slugField, kindField)
  pane.appendChild(grid)

  const titleField = document.createElement('label')
  titleField.className = 'field'
  const titleLabel = document.createElement('span')
  titleLabel.textContent = '标题'
  const titleInput = document.createElement('input')
  titleInput.type = 'text'
  const titleCount = counterFor(titleInput, 60)
  titleLabel.appendChild(titleCount.span)
  titleField.append(titleLabel, titleInput)
  pane.appendChild(titleField)

  const bodyField = document.createElement('label')
  bodyField.className = 'field'
  const bodyLabel = document.createElement('span')
  bodyLabel.textContent = '正文'
  const bodyInput = document.createElement('textarea')
  const bodyCount = counterFor(bodyInput, 400)
  bodyLabel.appendChild(bodyCount.span)
  bodyField.append(bodyLabel, bodyInput)
  pane.appendChild(bodyField)

  const row = document.createElement('div')
  row.className = 'row'
  const create = document.createElement('button')
  create.className = 'primary'
  create.textContent = '暂存'
  create.addEventListener('click', async () => {
    create.disabled = true
    const result = await api('/api/append', {
      slug: slugInput.value.trim(),
      kind: kindSelect.value,
      title: titleInput.value,
      body: bodyInput.value,
    })
    create.disabled = false
    if (result.ok !== true) return toast(result.error, true)
    toast('已暂存：' + result.id)
    selected = result.id
    await refresh()
  })
  const cancel = document.createElement('button')
  cancel.textContent = '取消'
  cancel.addEventListener('click', () => { selected = null; render() })
  row.append(create, cancel)
  pane.appendChild(row)
}

// ---- wiring -------------------------------------------------------------

$('#filter').addEventListener('input', (event) => {
  filter = event.target.value.trim()
  renderList()
})
$('#btn-new').addEventListener('click', () => { selected = NEW; renderList(); renderDetail() })
$('#btn-refresh').addEventListener('click', refresh)

refresh()
</script>
</body>
</html>
